<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Portfolio Profesional{% endblock %}</title>

    {% load static %}
    <!-- Enlace al archivo CSS compilado por Tailwind v4 -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    
    <!-- Incluir la barra de navegación modular -->
    {% include "components/_navbar.html" %}

    <!-- Contenido dinámico principal -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Incluir el pie de página modular -->
    {% include "components/_footer.html" %}

    <!-- Script de recarga automática para desarrollo -->
    {% include "django_browser_reload/reload_script.html" %}
</body>
</html>
