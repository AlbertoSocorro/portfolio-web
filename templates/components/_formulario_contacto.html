<div id="contacto-form-wrapper">
    {% if enviado %}
        <div class="p-6 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-xl text-center transition-colors">
            <h3 class="text-lg font-bold text-emerald-800 dark:text-emerald-300">¡Mensaje enviado con éxito!</h3>
            <p class="mt-2 text-sm text-emerald-600 dark:text-emerald-400">Gracias por contactar conmigo. Te responderé lo antes posible.</p>
        </div>
    {% else %}
        <form hx-post="{% url 'portfolio:contacto' %}" hx-target="#contacto-form-wrapper" hx-swap="outerHTML" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Tu Nombre</label>
                {{ form.nombre }}
                {{ form.nombre.errors }}
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Tu Correo Electrónico</label>
                {{ form.email }}
                {{ form.email.errors }}
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Mensaje</label>
                {{ form.mensaje }}
                {{ form.mensaje.errors }}
            </div>
            
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-medium rounded-lg transition-colors shadow-sm cursor-pointer">
                Enviar Mensaje
            </button>
        </form>
    {% endif %}
</div>
