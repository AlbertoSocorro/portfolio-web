<div id="grid-proyectos" class="grid grid-cols-1 md:grid-cols-2 gap-8">
    {% for proyecto in proyectos %}
        {% include "components/_tarjeta_proyecto.html" with proyecto=proyecto %}
    {% empty %}
        <div class="col-span-2 text-center py-12 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors">
            <p class="text-slate-500 dark:text-slate-400">No hay proyectos que coincidan con esta tecnología.</p>
        </div>
    {% endfor %}
</div>
